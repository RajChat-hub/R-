name: UNFALTERING Linux
on:
  push:
    paths: ['unfaltering/**', '.github/workflows/unfaltering-ci.yml']
  pull_request:
    paths: ['unfaltering/**', '.github/workflows/unfaltering-ci.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: g++, mode: Debug, sanitizers: 'OFF'}
          - {compiler: g++, mode: Release, sanitizers: 'OFF'}
          - {compiler: clang++, mode: Debug, sanitizers: 'ON'}
    steps:
      - name: Check out public project sources without unrelated submodule setup
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --no-cone /unfaltering/ /.github/
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
      - name: Update distro-maintained TLS dependency and record versions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --only-upgrade libssl-dev openssl
          openssl version -a
          dpkg-query -W libssl-dev openssl
      - name: Configure
        run: cmake -S unfaltering -B unfaltering/build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DUNFALTERING_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build unfaltering/build -j2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          UNFALTERING_INSTRUMENTED: ${{ matrix.sanitizers }}
        run: ctest --test-dir unfaltering/build --output-on-failure --verbose
      - name: Measured project footprint
        run: du -sk unfaltering
  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public project sources without unrelated submodule setup
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --no-cone /unfaltering/ /.github/
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
      - run: cmake -S unfaltering -B unfaltering/build -DCMAKE_CXX_COMPILER=clang++ -DUNFALTERING_FUZZ=ON -DBUILD_TESTING=OFF
      - run: cmake --build unfaltering/build -j2
      - run: ./unfaltering/build/uf_fuzz_http unfaltering/tests/fuzz/seeds/http -max_total_time=90 -max_len=65536 -timeout=3 -rss_limit_mb=768
      - run: ./unfaltering/build/uf_fuzz_config unfaltering/tests/fuzz/seeds/config -max_total_time=90 -max_len=65536 -timeout=3 -rss_limit_mb=768
      - run: ./unfaltering/build/uf_fuzz_response unfaltering/tests/fuzz/seeds/response -max_total_time=90 -max_len=65536 -timeout=3 -rss_limit_mb=768
  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public project sources without unrelated submodule setup
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --no-cone /unfaltering/ /.github/
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
      - run: cmake -S unfaltering -B unfaltering/build -DCMAKE_BUILD_TYPE=Debug -DUNFALTERING_TSAN=ON
      - run: cmake --build unfaltering/build -j2
      - name: Focused races and concurrent socket drills (explicit unsupported-runtime detection)
        env:
          UNFALTERING_INSTRUMENTED: 'ON'
          TSAN_OPTIONS: halt_on_error=1
        run: python3 unfaltering/tests/run_tsan.py unfaltering/build
  compare-foundation:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public project sources
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 origin "$SOURCE_REVISION"
          git sparse-checkout set --no-cone /unfaltering/ /.github/
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
      - name: Build matched Release executables
        run: |
          git fetch --no-tags --no-recurse-submodules --depth=1 origin 549c531e9ce2eff7fa5d5c64efc5d8fefce89c00
          mkdir -p /tmp/uf-foundation
          git archive FETCH_HEAD unfaltering | tar -x -C /tmp/uf-foundation
          cmake -S /tmp/uf-foundation/unfaltering -B /tmp/uf-foundation/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/uf-foundation/build -j2
          cmake -S unfaltering -B unfaltering/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build unfaltering/build -j2
      - name: Paired development sample and disk usage
        run: |
          python3 unfaltering/benchmarks/compare.py /tmp/uf-foundation/build/unfaltering unfaltering/build/unfaltering
          du -sk unfaltering /tmp/uf-foundation
